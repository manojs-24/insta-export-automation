[project]
name = "web-automation-engine"
version = "0.1.0"
description = "Rule-based browser automation engine powered by Playwright"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.162.5",
    "playwright>=1.65.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
web-automation = "web_automation.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches real Google Chrome (deselect with -m 'not browser')"]

[tool.uv.build-backend]
module-name = "web_automation"
